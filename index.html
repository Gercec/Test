<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание Физтех-Колледж</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, system-ui, sans-serif; }
    body { background-color: #0d0d0d; color: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { width: 100%; max-width: 800px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; }
    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
    .controls { display: flex; gap: 10px; width: 100%; max-width: 800px; margin-bottom: 20px; flex-wrap: wrap; }
    .select-btn, .action-btn { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 10px 15px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; transition: all 0.2s ease; }
    .select-btn:hover, .action-btn:hover { border-color: #666; background: #262626; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { background: #141414; border: 1px solid #333; padding: 20px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; border-radius: 6px; }
    .group-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; }
    .group-item:hover { background: #222; color: #00ffcc; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
    .day-card { background: #141414; border: 1px solid #262626; border-radius: 6px; padding: 15px; }
    .day-title { font-size: 1rem; color: #00ffcc; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
    .lesson { background: #1a1a1a; border-left: 3px solid #00ffcc; padding: 10px; margin-bottom: 8px; border-radius: 0 4px 4px 0; }
    .lesson-time { font-size: 0.8rem; color: #888; margin-bottom: 4px; }
    .lesson-subject { font-weight: bold; color: #fff; margin-bottom: 4px; }
    .lesson-meta { font-size: 0.85rem; color: #aaa; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; }
    .break-note { font-size: 0.75rem; color: #ff9900; margin-top: 4px; }
    .status-bar { font-size: 0.75rem; color: #666; text-align: right; margin-top: 5px; }
    .empty-state { text-align: center; padding: 40px; color: #666; width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Расписание Физтех-Колледж</h1>
    <div id="status" class="status-bar">Загрузка...</div>
  </header>
  <div class="controls">
    <button id="groupTrigger" class="select-btn" onclick="openGroupModal()">Выберите группу</button>
    <button class="action-btn" onclick="forceRefresh()">Загрузить и скачать .xlsx</button>
  </div>
  <div id="groupModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <strong style="color:#fff;">ВЫБОР ГРУППЫ</strong>
        <span style="cursor:pointer; color:#888;" onclick="closeGroupModal()">&times;</span>
      </div>
      <div id="groupList"></div>
    </div>
  </div>
  <div id="scheduleContainer" class="container"></div>

  <script>
    const FOUR_HOURS_MS = 4 * 60 * 60 * 1000;
    const DAY_MAP = { 'пн': 'Понедельник', 'вт': 'Вторник', 'ср': 'Среда', 'чт': 'Четверг', 'пт': 'Пятница' };

    let parsedSchedule = {};
    let selectedGroup = localStorage.getItem('phystech_selected_group') || '';

    function buildDynamicScheduleUrl(dateObj = new Date()) {
      const day = String(dateObj.getDate()).padStart(2, '0');
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const year = dateObj.getFullYear();
      
      const fileName = `${day}.${month}.-Структурное-подразделение-№1.xlsx`;
      return {
        fileName,
        url: `https://phystech.pro/wp-content/uploads/${year}/${month}/${encodeURIComponent(fileName)}`
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSchedule();
      setInterval(checkAndFetchSchedule, FOUR_HOURS_MS);
    });

    async function checkAndFetchSchedule() {
      await fetchScheduleLocally();
    }

    async function initSchedule() {
      const lastFetch = localStorage.getItem('phystech_schedule_last_fetch');
      const cachedBase64 = localStorage.getItem('phystech_schedule_base64');
      const now = Date.now();

      if (!lastFetch || !cachedBase64 || (now - parseInt(lastFetch, 10)) > FOUR_HOURS_MS) {
        await fetchScheduleLocally();
      } else {
        updateStatus("Из кэша устройства");
        parseBase64Data(cachedBase64);
      }
    }

    async function forceRefresh() {
      await fetchScheduleLocally(true);
    }

    async function fetchScheduleLocally(triggerDownload = false) {
      updateStatus("Поиск актуального файла...");
      
      let success = false;
      const today = new Date();

      for (let offset = 0; offset < 5; offset++) {
        const targetDate = new Date(today);
        targetDate.setDate(today.getDate() - offset);
        
        const { fileName, url } = buildDynamicScheduleUrl(targetDate);
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

        try {
          updateStatus(`Проверка за ${targetDate.getDate()}.${targetDate.getMonth() + 1}...`);
          const res = await fetch(proxyUrl);
          
          if (res.ok) {
            const blob = await res.blob();
            
            // Если вызвано пользователем вручную или загружается свежий файл — скачиваем файл на устройство
            if (triggerDownload) {
              const downloadUrl = window.URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.style.display = 'none';
              a.href = downloadUrl;
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              a.remove();
              window.URL.revokeObjectURL(downloadUrl);
            }

            await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = function(e) {
                const base64 = e.target.result;
                try {
                  localStorage.setItem('phystech_schedule_base64', base64);
                  localStorage.setItem('phystech_schedule_last_fetch', Date.now().toString());
                } catch(err) {}
                updateStatus("Обновлено только что");
                parseBase64Data(base64);
                resolve();
              };
              reader.readAsDataURL(blob);
            });
            
            success = true;
            break;
          }
        } catch(err) {
          // Пробуем следующую прошлую дату
        }
      }

      if (!success) {
        updateStatus("Ошибка сети, загрузка из кэша");
        const cached = localStorage.getItem('phystech_schedule_base64');
        if (cached) parseBase64Data(cached);
        else renderEmpty("Не удалось найти актуальный файл расписания.");
      }
    }

    function parseBase64Data(base64Data) {
      try {
        const cleanStr = base64Data.split(',')[1] || base64Data;
        const wb = XLSX.read(cleanStr, { type: 'base64' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1 });
        cleanAndBuildSchedule(rawRows);
      } catch(err) {
        renderEmpty("Ошибка парсинга таблицы Excel.");
      }
    }

    function cleanAndBuildSchedule(rows) {
      parsedSchedule = {};
      if (!rows || rows.length < 2) return;

      const headerRow = rows[0] || [];
      const groupCols = [];

      for (let c = 3; c < headerRow.length; c++) {
        const val = headerRow[c] ? String(headerRow[c]).trim() : '';
        if (val && val.length > 2) {
          const gName = val.replace(/группа/gi, '').trim();
          groupCols.push({ col: c, name: gName });
          if (!parsedSchedule[gName]) {
            parsedSchedule[gName] = { 'пн': [], 'вт': [], 'ср': [], 'чт': [], 'пт': [] };
          }
        }
      }

      let currentDay = 'пн';

      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || row.length === 0) continue;

        const dayRaw = row[0] ? String(row[0]).trim().toLowerCase() : '';
        if (dayRaw.startsWith('пн') || dayRaw.startsWith('пон')) currentDay = 'пн';
        else if (dayRaw.startsWith('вт')) currentDay = 'вт';
        else if (dayRaw.startsWith('ср')) currentDay = 'ср';
        else if (dayRaw.startsWith('чт')) currentDay = 'чт';
        else if (dayRaw.startsWith('пт')) currentDay = 'пт';

        const timeStr = row[2] ? String(row[2]).trim() : '';
        if (!timeStr || row[1] === 'перерыв') continue;

        const tParts = timeStr.split(/[-–—]/).map(t => t.trim());
        const startTime = tParts[0] || '';
        const endTime = tParts[1] || '';

        groupCols.forEach(g => {
          const cell = row[g.col] ? String(row[g.col]).trim() : '';
          if (!cell) return;

          const parts = cell.split('/').map(p => p.trim());
          const subject = parts[0] ? parts[0].toUpperCase() : '';
          const teacher = parts[1] || '';
          const roomRaw = parts[2] || '';
          const room = (!roomRaw || roomRaw.toLowerCase().includes('нет')) ? '' : `КАБ. ${roomRaw}`;

          if (subject) {
            parsedSchedule[g.name][currentDay].push({
              subject, teacher, startTime, endTime, room,
              time: `${startTime} - ${endTime}`,
              breakNote: null
            });
          }
        });
      }

      for (const g in parsedSchedule) {
        for (const d in parsedSchedule[g]) {
          const list = parsedSchedule[g][d];
          const combined = [];
          let i = 0;
          while (i < list.length) {
            const curr = list[i];
            const next = list[i + 1];
            if (next && curr.subject === next.subject && curr.teacher === next.teacher) {
              combined.push({
                subject: curr.subject,
                teacher: curr.teacher,
                startTime: curr.startTime,
                endTime: next.endTime,
                time: `${curr.startTime} - ${next.endTime}`,
                breakNote: `ПЕРЕРЫВ: ${curr.endTime} - ${next.startTime}`,
                room: curr.room || next.room
              });
              i += 2;
            } else {
              combined.push(curr);
              i += 1;
            }
          }
          parsedSchedule[g][d] = combined;
        }
      }

      const availableGroups = Object.keys(parsedSchedule).sort((a,b) => a.localeCompare(b, 'ru', {numeric: true}));
      buildGroupModal(availableGroups);

      if (!selectedGroup || !parsedSchedule[selectedGroup]) {
        selectedGroup = availableGroups.includes('ИС-51') ? 'ИС-51' : (availableGroups[0] || '');
        localStorage.setItem('phystech_selected_group', selectedGroup);
      }

      document.getElementById('groupTrigger').textContent = selectedGroup ? `ГРУППА: ${selectedGroup}` : 'Выберите группу';
      renderSchedule();
    }

    function buildGroupModal(groups) {
      const container = document.getElementById('groupList');
      container.innerHTML = '';
      groups.forEach(g => {
        const item = document.createElement('div');
        item.className = 'group-item';
        item.textContent = g;
        item.onclick = () => {
          selectedGroup = g;
          localStorage.setItem('phystech_selected_group', g);
          document.getElementById('groupTrigger').textContent = `ГРУППА: ${g}`;
          closeGroupModal();
          renderSchedule();
        };
        container.appendChild(item);
      });
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      if (!selectedGroup || !parsedSchedule[selectedGroup]) {
        renderEmpty("Выберите группу для отображения расписания.");
        return;
      }

      const daysData = parsedSchedule[selectedGroup];
      let hasData = false;

      for (const dayKey in DAY_MAP) {
        const lessons = daysData[dayKey] || [];
        if (lessons.length === 0) continue;
        hasData = true;

        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `<div class="day-title">${DAY_MAP[dayKey]}</div>`;

        lessons.forEach(l => {
          const lesEl = document.createElement('div');
          lesEl.className = 'lesson';
          lesEl.innerHTML = `
            <div class="lesson-time">${l.time}</div>
            <div class="lesson-subject">${l.subject}</div>
            <div class="lesson-meta">
              <span>${l.teacher}</span>
              <span>${l.room}</span>
            </div>
            ${l.breakNote ? `<div class="break-note">${l.breakNote}</div>` : ''}
          `;
          card.appendChild(lesEl);
        });

        container.appendChild(card);
      }

      if (!hasData) renderEmpty("Для данной группы нет занятий на текущую неделю.");
    }

    function renderEmpty(msg) {
      document.getElementById('scheduleContainer').innerHTML = `<div class="empty-state"><code>${msg}</code></div>`;
    }

    function updateStatus(txt) {
      document.getElementById('status').textContent = txt;
    }

    function openGroupModal() {
      document.getElementById('groupModal').style.display = 'flex';
    }

    function closeGroupModal() {
      document.getElementById('groupModal').style.display = 'none';
    }
  </script>
</body>
</html>
